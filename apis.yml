aid: verato
name: Verato
description: >-
  Verato is a healthcare identity company whose Universal Identity Platform (MDM
  Cloud) resolves and matches records for people, providers, and organizations
  against a proprietary nationwide referential database to create and maintain a
  single source of truth (golden record). Verato publishes a developer portal
  with three RESTful JSON web-service APIs — the Person API (patient/consumer
  identity, demographics search, linking, merging, households, relationships),
  the Organization API, and the Provider API (Practitioner Type-1 and Health
  Facility Type-2 identities) — used for enterprise master data management,
  patient matching, provider data management, identity resolution, and
  downstream data enrichment. APIs authenticate with HTTP basic credentials over
  mutual TLS, with keys provisioned per tenant by a Customer Success Manager.
