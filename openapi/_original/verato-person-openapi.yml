  /v2/demographicsSearch:
    post:
      summary: Search using demographic information (demographicsSearch)
      description: >-
        Searches Verato using the provided demographic attributes. It returns
        zero or more candidate identities ordered by match score.
      operationId: post_v2_demographicsSearch
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_v2__demographicsSearch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_v2__demographicsSearch'
  /v2/demographicsQuery:
    post:
      summary: Query using demographic information (demographicsQuery)
      description: >-
        Searches Verato using the provided demographic information and returns
        the best-matching identity if found.
      operationId: post_v2_demographicsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_v2__demographicsQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_v2__demographicsQuery'
  /v2/identityIdQuery:
    post:
      summary: Query using link ID (identityIdQuery)
      description: Search for an Identity with supplied linkId
      operationId: post_v2_identityIdQuery
      responses:
