  /deactivateSourceWs:
    post:
      summary: Deactivate source from identities (deactivateSourceWs)
      description: >-
        Used to deactivate (logically delete) a source record from your instance
        of Universal Identity.
      operationId: post_deactivateSourceWs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
