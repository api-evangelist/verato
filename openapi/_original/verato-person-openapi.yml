  /v2/nativeIdQuery:
    post:
      summary: Query using native ID (nativeIdQuery)
      description: >-
        Searches Verato for an identity using source name + native ID (the
        customer's source system identifier).
      operationId: post_v2_nativeIdQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_v2__nativeIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_v2__nativeIdQuery'
  /createDataSource:
    post:
      summary: Create Data Sources (createDataSource)
      description: >
        Creates one or more new data sources in the Universal Identity platform.
        Up to 10 data sources can be created per call. Newly added sources may
        take 10–15 minutes to become available. This service only adds data
        sources — it does not delete or modify existing ones.


        Source name constraints: maximum 255 characters, no spaces, and the
        following characters are not supported: `" | : '`. Source names are
        case-sensitive; Verato recommends a consistent capitalization standard
        (all uppercase or all lowercase) to avoid duplicate records.


        Failed additions are reported individually in the response and do not
        prevent other sources in the same request from being created. Common
        failure causes include the source already existing or the name matching
        a reserved Verato source code (e.g. "Verato").
      operationId: post_createDataSource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_createDataSource'
              example:
                auditId: 3f7a1c00-12ab-4def-8901-23456789abcd
                success: true
                retryableError: false
                message: null
                errors: []
                trackingId: my-tracking-id-001
                content:
                  datasourceCreationResponses:
                    - datasource: EHR_SYSTEM_A
                      status: SUCCESS
                      error: null
                    - datasource: BILLING_SYSTEM_B
                      status: SUCCESS
                      error: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_createDataSource'
            example:
              trackingId: my-tracking-id-001
              content:
                sources:
                  - EHR_SYSTEM_A
                  - BILLING_SYSTEM_B
  /deleteSourceIdentity:
    post:
      summary: Hard Delete a Source (deleteSourceIdentity)
      description: >-
        Permanently removes all information and history associated with a
        specific source name + native ID across Verato. This also removes
        merge/unmerge history associated with that source identity. Use with
        caution.
      operationId: post_deleteSourceIdentity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteSourceIdentity'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteSourceIdentity'
  /reactivateSourceWs:
    post:
      summary: Reactivate source from identities (reactivateSourceWs)
      description: >-
        Used to reactivate a source record from your instance of Universal
        Identity, that was previously deactivated.
      operationId: post_reactivateSourceWs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_reactivateSourceWs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
