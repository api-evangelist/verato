  /demographicsSearch:
    post:
      summary: Search using demographic information (demographicsSearch)
      description: >-
        Searches Verato using the provided demographic and provider attributes.
        It returns zero or more candidate identities ordered by match score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_demographicsSearch'
      responses:
        '200':
          description: Demographics search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_demographicsSearch'
  /demographicsQuery:
    post:
      summary: Query using demographic information (demographicsQuery)
      description: >-
        Searches Verato using the provided demographic information and returns
        the best-matching identity if found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_demographicsQuery'
      responses:
        '200':
          description: Demographics query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_demographicsQuery'
  /identityIdQuery:
    post:
      summary: Query using link ID (identityIdQuery)
      description: Search for an Identity with supplied linkId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_identityIdQuery'
      responses:
        '200':
          description: Identity by link ID response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_identityIdQuery'
  /nativeIdQuery:
    post:
      summary: Query using native ID (nativeIdQuery)
      description: >-
        Searches Verato for an identity using source name + native ID (the
        customer's source system identifier).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_nativeIdQuery'
      responses:
        '200':
          description: Native ID query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_nativeIdQuery'
  /deleteSourceIdentity:
    post:
      summary: Hard Delete a Source (deleteSourceIdentity)
      description: >-
        Permanently removes all information and history associated with a
        specific source name + native ID across Verato. This also removes
        merge/unmerge history associated with that source identity. Use with
        caution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteSourceIdentity'
      responses:
        '200':
          description: Hard delete source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteSourceIdentity'
  /restoreSource:
    post:
      summary: Restore a soft-deleted source (restoreSource)
      description: >
        Restores a previously soft-deleted source across all identities where it
        was present. A new entity may be created or existing entities modified
        depending on the current state of the graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_restoreSource'
      responses:
        '200':
          description: Restore source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_restoreSource'
  /softDeleteSource:
    post:
      summary: Soft delete a source from identities (softDeleteSource)
      description: >
        Soft deletes a source from all identities that reference it. The source
        and its data are marked as deleted but can be restored later. Merge and
        linkage history is preserved for audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_softDeleteSource'
      responses:
        '200':
          description: Soft delete source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_softDeleteSource'
  /linkIdentities:
    post:
      summary: Link two identities (linkIdentities)
      description: >
        Links two existing identities together without retiring either source.
        This is typically used when you determine that two separate source
        identities belong to the same real-world provider, and they should be
        represented as a single link ID. Note: only provider identities of the
        same type can be linked together (ie Practitioner to Practitioner, not
        Practitioner and Health Facility).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_linkIdentities'
      responses:
        '200':
          description: Link identities response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_linkIdentities'
  /mergeIdentities:
    post:
      summary: Merge two identities (mergeIdentities)
      description: >
        Merges a "toRetire" source identity into a "toSurvive" source identity.
        After a merge, the retired source is marked as merged and the surviving
        identity contains combined data. The response returns the surviving
        linkId. Note: only provider identities of the same type can be merged
        together (ie Practitioner to Practitioner, not Practitioner and Health
        Facility).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_mergeIdentities'
      responses:
        '200':
          description: Merge identities response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_mergeIdentities'
  /searchNotifications:
    post:
      summary: Query notifications (searchNotifications)
      description: >
        Retrieves identity-related notifications for a specific period of time,
        such as merge events, link/unlink events, or other configured
        notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_searchNotifications'
      responses:
        '200':
          description: Notifications search response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_searchNotifications'
  /unlinkIdentities:
    post:
      summary: Unlink two identities (unlinkIdentities)
      description: |
        Unlinks two previously linked identities, splitting them into separate
        entities and returning their linkIds and associated source information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_unlinkIdentities'
      responses:
        '200':
          description: Unlink identities response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_unlinkIdentities'
  /unmergeIdentities:
    post:
      summary: Unmerge two identities (unmergeIdentities)
      description: >
        Reverses a previous merge operation by extracting a previously merged
        source identity into its own record. Returns the new link ID and the
        linkId it was unmerged from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_unmergeIdentities'
      responses:
        '200':
          description: Unmerge identities response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_unmergeIdentities'
  /addRelationshipService:
    post:
      summary: Add a new relationship (addRelationshipService)
      description: |
        Adds a relationship between two identities according to configured
        relationship definitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_addRelationshipService'
      responses:
        '200':
          description: Add relationship response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_addRelationshipService'
  /searchRelationshipsService:
    post:
      summary: Searches for relationships (searchRelationshipsService)
      description: |
        Searches for relationships
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_searchRelationshipsService'
      responses:
        '200':
          description: Search/update relationship response
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/ServiceResponse_searchRelationshipsService
  /deleteRelationshipService:
    post:
      summary: Delete a relationship (deleteRelationshipService)
      description: |
        Deletes a previously defined relationship between two identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteRelationshipService'
      responses:
        '200':
          description: Delete relationship response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteRelationshipService'
components:
  schemas:
    ClusterStatus:
      type: string
      description: Status of a clustered attribute.
      enum:
        - ACTIVE
        - INACTIVE
    YesNoUnknown:
      type: string
      description: Ternary value indicating yes/no/unknown.
      enum:
        - 'Y'
        - U
        - 'N'
    StringMap:
      type: object
      additionalProperties:
        type: string
      description: Map of string keys to string values.
    ObjectMap:
      type: object
      additionalProperties: {}
      description: Map of string keys to arbitrary JSON values.
    StringListMap:
      type: object
      additionalProperties:
        type: array
        items:
          type: string
      description: Map of string keys to lists of strings.
    Domain:
      type: object
      description: Identity domain (e.g., Provider, Person, Organization).
      properties:
        id:
          type: string
          description: Domain identifier.
        name:
          type: string
          description: Domain name.
    BaseServiceRequest:
      type: object
      description: Standard wrapper for all service requests.
      properties:
        trackingId:
          type: string
          description: Optional client-defined correlation ID.
    BaseServiceResponse:
      type: object
      description: Standard wrapper for all service responses.
      properties:
        auditId:
          type: string
          description: Unique audit identifier for correlating requests and responses.
        success:
          type: boolean
          description: Indicates whether the business operation succeeded.
        warnings:
          type: array
          items:
            type: string
          description: Non-fatal warnings generated by the operation.
        retryableError:
          type: boolean
          description: >-
            Indicates whether an error is transient and the request may be
            retried.
        message:
          type: string
          description: Human-readable status message.
        errors:
          type: array
          items:
            type: string
          description: Error messages if success is false.
        trackingId:
          type: string
          description: Echo of the request trackingId, if provided.
    Identity:
      type: object
      description: >
        Unified identity representation containing the properties common to
        Practitioner (Type 1) and Health Facility (Type 2) provider identities.
        Type-specific properties (e.g., `names`, `practitionerRoles` for
        Practitioner; `organizationNames`, `authorizedOfficials` for Health
        Facility) are also accepted on this object — see the request examples
        for the full shape per type.
      required:
        - sources
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            The data source that provided this identity. Exactly one source is
            required per request.
          items:
            $ref: '#/components/schemas/PostIdentitySource'
        contactInformation:
          type: array
          items:
            $ref: '#/components/schemas/ContactInformationGrouped'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/PhoneNumber'
        faxNumbers:
          type: array
          items:
            $ref: '#/components/schemas/FaxNumber'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
        npis:
          type: array
          items:
            $ref: '#/components/schemas/NPI'
        license:
          type: array
          items:
            $ref: '#/components/schemas/LicenseSimple'
        specialties:
          type: array
          items:
            $ref: '#/components/schemas/SpecialtySimple'
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/Qualification'
        alternateIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/AlternateIdentifier'
        externalUniqueIdentifier:
          type: array
          items:
            $ref: '#/components/schemas/ExternalUniqueIdentifier'
    PractitionerType1:
      type: object
      description: Practitioner (Type 1) – individual healthcare provider domain.
      required:
        - sources
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 1
          description: >-
            The data source that provided this identity. Exactly one source is
            required per request.
          items:
            $ref: '#/components/schemas/PostIdentitySource'
        names:
          type: array
          items:
            $ref: '#/components/schemas/PractitionerName'
        datesOfBirth:
          type: array
          items:
            $ref: '#/components/schemas/DateOfBirth'
        genders:
          type: array
          items:
            $ref: '#/components/schemas/GenderCode'
        genderIdentities:
          type: array
          items:
            $ref: '#/components/schemas/GenderIdentityCode'
        contactInformation:
          type: array
          items:
            $ref: '#/components/schemas/ContactInformationGrouped'
        addresses:
