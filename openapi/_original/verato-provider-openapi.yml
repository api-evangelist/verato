openapi: 3.0.3
info:
  title: Verato Provider API
  version: 2026.1.2
  description: >
    Verato Provider Link services for managing provider identities (Practitioner
    Type 1, Health Facility Type 2, and Organizations), including:
      - Creating and updating master identities
      - Searching and querying by demographics, source/native IDs, and link IDs
      - Managing source lifecycle (soft delete, restore, hard delete)
      - Managing merge, unmerge, link, unlink workflows
      - Managing graph relationships between Verato entities
      - Retrieving identity-related notifications
security:
  - basicAuth: []
servers:
  - url: https://yourveratodomain.com/provider-link-ws/svc
    description: Production Provider Link API
  - url: https://yourveratodomain.com/provider-link-ws/svc
    description: Sandbox Provider Link API
