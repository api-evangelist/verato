        - toRetireSource
        - toSurviveSource
      properties:
        toSurviveSource:
          description: Source representing the identity that will survive.
          $ref: '#/components/schemas/Source'
        toRetireSource:
          description: Source representing the identity that will be retired.
          $ref: '#/components/schemas/Source'
