openapi: 3.0.3
info:
  title: Verato Organization API
  version: 2026.1.2
  description: >
    The Verato Organization API provides comprehensive identity management
    capabilities for organizations within the Verato LINK platform. This API
    enables you to:


    - **Ingest and manage organization identities**: Add, update, and delete
    organization records with rich demographic and contact information.

    - **Search and query**: Find organizations using demographic data, native
    IDs, or link IDs (Verato's golden identifier).

    - **Lifecycle management**: Soft-delete and restore organization records
    while preserving data history.

    - **Merge and link operations**: Consolidate duplicate organizations, manage
    master data relationships, and maintain data lineage.

    - **Relationship management**: Define and query relationships between
    organizations (parent-child, affiliations, etc.).

    - **Notifications**: Track and audit identity changes and events across your
    organization data.


    All operations follow a standard request/response envelope pattern with
    audit tracking, error handling, and optional response format customization.
security:
  - basicAuth: []
servers:
  - url: https://yourveratodomain.com/org-link-ws/svc
    description: Production Organization Link API
  - url: https://yourveratodomain.com/org-link-ws/svc
    description: Sandbox Organization Link API
paths:
  /postIdentity:
    post:
      summary: Add an Identity (postIdentity)
      description: Adds a new identity into Verato.
      operationId: postIdentity
      requestBody:
        required: true
        description: The web service request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_postIdentity'
      responses:
        '200':
          description: Successful POST identity operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_postIdentity'
  /demographicsSearch:
    post:
      summary: Search using demographic information (demographicsSearch)
      description: >-
        Searches Verato using the provided demographic and provider attributes.
        It returns zero or more candidate identities ordered by match score.
      operationId: demographicsSearch
      requestBody:
        required: true
        description: The demographics search request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_demographicsSearch'
            examples:
              example1:
                summary: Demographics search with bestTimeToContact as object
                value:
                  content:
                    identity:
                      organizationNames:
                        - legalBusinessName: ACME Health
                      contactInformation:
                        - address:
                            line1: 123 Main St
                            city: Springfield
                            state: VA
                            postalCode: '22150'
                          phoneList:
                            - number: '5551234567'
                              type: WORK
                              bestTimeToContact:
                                day: MON
                                startTime: '09:00'
                                endTime: '17:00'
                                allDay: false
                          bestTimeToContact:
                            day: MON
                            startTime: '09:00'
                            endTime: '17:00'
                            allDay: false
                    matchScoreThreshold: 0.85
                    maxSearchResults: 10
                  trackingId: TRACK-123
      responses:
        '200':
          description: Successful demographics search operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_demographicsSearch'
  /demographicsQuery:
    post:
      summary: Query using demographic information (demographicsQuery)
      description: >-
        Searches Verato using the provided demographic information and returns
        the best-matching identity if found.
      operationId: demographicsQuery
      requestBody:
        required: true
        description: The demographics query request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_demographicsQuery'
      responses:
        '200':
          description: Successful demographics query operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_demographicsQuery'
  /identityIdQuery:
    post:
      summary: Query using link ID (identityIdQuery)
      description: Search for an Identity with supplied linkId
      operationId: identityIdQuery
      requestBody:
        required: true
        description: The identity ID query request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_identityIdQuery'
      responses:
        '200':
          description: Successful identity ID query operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_identityIdQuery'
  /nativeIdQuery:
    post:
      summary: Query using native ID (nativeIdQuery)
      description: >-
        Searches Verato for an identity using source name + native ID (the
        customer's source system identifier).
      operationId: nativeIdQuery
      requestBody:
        required: true
        description: The native ID query request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_nativeIdQuery'
      responses:
        '200':
          description: Successful native ID query operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_nativeIdQuery'
  /deleteSourceIdentity:
    post:
      summary: Hard Delete a Source (deleteSourceIdentity)
      description: >
        Permanently removes all information and history associated with the
        given

        source (source name + nativeId) from Verato. This also removes any

        merge/unmerge history associated with that source.
      operationId: deleteSourceIdentity
      requestBody:
        required: true
        description: The web service request containing the source to delete.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteSourceIdentity'
      responses:
        '200':
          description: Successful delete source identity operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteSourceIdentity'
  /restoreSource:
    post:
      summary: Restore a soft-deleted source (restoreSource)
      description: >
        Restores a previously soft-deleted source across all identities where it
        was present. A new entity may be created or existing entities modified
        depending on the current state of the graph.
      operationId: restoreSource
      requestBody:
        required: true
        description: The restore source request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_restoreSource'
      responses:
        '200':
          description: Successful restore source operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_restoreSource'
  /softDeleteSource:
    post:
      summary: Soft delete a source from identities (softDeleteSource)
      description: >
        Soft deletes a source from all identities that reference it. The source
        and its data are marked as deleted but can be restored later. Merge and
        linkage history is preserved for audit.
      operationId: softDeleteSource
      requestBody:
        required: true
        description: The soft delete source request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_softDeleteSource'
      responses:
        '200':
          description: Successful soft delete source operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_softDeleteSource'
  /linkIdentities:
    post:
      summary: Link two identities (linkIdentities)
      description: >
        Links two existing identities together without retiring either source.
        This is typically used when you determine that two separate source
        identities belong to the same real-world person, and they should be
        represented as a single link ID.
      operationId: linkIdentities
      requestBody:
        required: true
        description: The link identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_linkIdentities'
      responses:
        '200':
          description: Successful link identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_linkIdentities'
  /mergeIdentities:
    post:
      summary: Merge two identities (mergeIdentities)
      description: >
        Merges a "toRetire" source identity into a "toSurvive" source identity.
        After a merge, the retired source is marked as merged and the surviving
        identity contains combined data. The response returns the surviving
        linkId.
      operationId: mergeIdentities
      requestBody:
        required: true
        description: The merge identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_mergeIdentities'
      responses:
        '200':
          description: Successful merge identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_mergeIdentities'
  /searchNotifications:
    post:
      summary: Query notifications (searchNotifications)
      description: >
        Retrieves identity-related notifications for a specific period of time,
        such as merge events, link/unlink events, or other configured
        notifications.
      operationId: searchNotifications
      requestBody:
        required: true
        description: The notification search request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_searchNotifications'
      responses:
        '200':
          description: Successful search notifications operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_searchNotifications'
  /unlinkIdentities:
    post:
      summary: Unlink two identities (unlinkIdentities)
      description: |
        Unlinks two previously linked identities, splitting them into separate
        entities and returning their linkIds and associated source information.
      operationId: unlinkIdentities
      requestBody:
        required: true
        description: The unlink identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_unlinkIdentities'
      responses:
        '200':
          description: Successful unlink identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_unlinkIdentities'
  /unmergeIdentities:
    post:
      summary: Unmerge two identities (unmergeIdentities)
      description: >
        Reverses a previous merge operation by extracting a previously merged
        source identity into its own record. Returns the new link ID and the
        linkId it was unmerged from.
      operationId: unmergeIdentities
      requestBody:
        required: true
        description: The unmerge identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_unmergeIdentities'
      responses:
        '200':
          description: Successful unmerge identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_unmergeIdentities'
  /addRelationshipService:
    post:
      summary: Add a new relationship (addRelationshipService)
      description: |
        Adds a relationship between two identities according to configured
        relationship definitions.
      operationId: addRelationship
      requestBody:
        required: true
        description: The add relationship request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_addRelationshipService'
      responses:
        '200':
          description: Successful add relationship operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_addRelationshipService'
  /searchRelationshipsService:
    post:
      summary: Searches for relationships (searchRelationshipsService)
      description: |
        Searches for relationships
      operationId: searchRelationships
      requestBody:
        required: false
        description: The search/update relationship request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_searchRelationshipsService'
      responses:
        '200':
          description: Successful search/update relationship operation.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/ServiceResponse_searchRelationshipsService
  /deleteRelationshipService:
    post:
      summary: Delete a relationship (deleteRelationshipService)
      description: |
        Deletes a previously defined relationship between two identities.
      operationId: deleteRelationship
      requestBody:
        required: true
        description: The delete relationship request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteRelationshipService'
      responses:
        '200':
          description: Successful delete relationship operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteRelationshipService'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CODE-SET:
      type: string
      description: CODE-SET data type, see documentation for more details.
    TEXT:
      type: string
      description: TEXT data type, see documentation for more details.
    NUMBER:
      type: string
      description: NUMBER data type, see documentation for more details.
    DATE:
      type: string
      format: date
      description: DATE data type (yyyy-MM-dd), see documentation for more details.
    TIME:
      type: string
      description: TIME data type, see documentation for more details.
    BOOLEAN:
      type: boolean
      description: BOOLEAN data type, see documentation for more details.
    Map_string_string:
      type: object
      additionalProperties:
        type: string
      description: Generic map of string keys to string values.
    Map_string_Object:
      type: object
      additionalProperties: {}
      description: Generic map of string keys to arbitrary values.
    Domain:
      type: object
      properties:
        name:
          type: string
        id:
          type: string
    Source:
      type: object
      description: Tracks an identity to a particular source system and record ID.
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-MM-dd).
        name:
          type: string
          description: Name of the data source. Must be unique across Verato.
        id:
          type: string
          description: ID of an identity within the given data source.
    Identity:
      type: object
      description: |
        Logical identity in the Verato platform. Contains domain-specific
        attributes for Person, Provider, Health Facility, and Organization.
      properties:
        organizationNames:
          type: array
          items:
            $ref: '#/components/schemas/organizationNames'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/addresses'
        contactInformation:
          type: array
          items:
            $ref: '#/components/schemas/contactInformation'
        phoneNumbers:
          type: array
          items:
            $ref: '#/components/schemas/phoneNumbers'
        faxNumbers:
          type: array
          items:
            $ref: '#/components/schemas/faxNumbers'
        emails:
          type: array
          items:
            $ref: '#/components/schemas/emails'
        alternateIdentifiers:
          type: array
          items:
            $ref: '#/components/schemas/alternateIdentifiers'
        externalUniqueIdentifier:
          type: array
          items:
            $ref: '#/components/schemas/externalUniqueIdentifier'
        authorizedOfficials:
          type: array
          items:
            $ref: '#/components/schemas/authorizedOfficials'
        employerIdentificationNumber:
          type: array
          items:
            $ref: '#/components/schemas/employerIdentificationNumber'
        naicsClassifications:
          type: array
          items:
            $ref: '#/components/schemas/naicsClassifications'
        sicClassifications:
          type: array
          items:
            $ref: '#/components/schemas/sicClassifications'
        qualifications:
          type: array
          items:
            $ref: '#/components/schemas/qualifications'
        types:
          type: array
          items:
            $ref: '#/components/schemas/types'
        contactOther:
          type: array
          items:
            $ref: '#/components/schemas/contactOther'
        product:
          type: array
          items:
            $ref: '#/components/schemas/product'
        numberOfEmployees:
          type: array
          items:
            $ref: '#/components/schemas/numberOfEmployees'
        foundedDate:
          type: array
          items:
            $ref: '#/components/schemas/foundedDate'
        annualRevenue:
          type: array
          items:
            $ref: '#/components/schemas/annualRevenue'
        legalStatus:
          type: array
          items:
            $ref: '#/components/schemas/legalStatus'
    organizationNames:
      type: object
      properties:
        legalBusinessName:
          $ref: '#/components/schemas/TEXT'
        otherOrgName:
          $ref: '#/components/schemas/TEXT'
        tradingName:
          $ref: '#/components/schemas/TEXT'
        parentOrgName:
          $ref: '#/components/schemas/TEXT'
    addresses:
      type: object
      properties:
        addressName:
          $ref: '#/components/schemas/TEXT'
        addressType:
          $ref: '#/components/schemas/CODE-SET'
        line1:
          $ref: '#/components/schemas/TEXT'
        line2:
          $ref: '#/components/schemas/TEXT'
        city:
          $ref: '#/components/schemas/TEXT'
        district:
          $ref: '#/components/schemas/TEXT'
        state:
          $ref: '#/components/schemas/TEXT'
        postalCode:
          $ref: '#/components/schemas/TEXT'
        country:
          $ref: '#/components/schemas/TEXT'
        latitude:
          $ref: '#/components/schemas/NUMBER'
        longitude:
          $ref: '#/components/schemas/NUMBER'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    bestTimeToContact:
      type: object
      properties:
        day:
          $ref: '#/components/schemas/CODE-SET'
        startTime:
          $ref: '#/components/schemas/TIME'
        endTime:
          $ref: '#/components/schemas/TIME'
        allDay:
          $ref: '#/components/schemas/BOOLEAN'
    phoneNumbers:
      type: object
      properties:
        number:
          $ref: '#/components/schemas/NUMBER'
        type:
          $ref: '#/components/schemas/CODE-SET'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
        bestTimeToContact:
          $ref: '#/components/schemas/bestTimeToContact'
      example:
        number: '5551234567'
        type: WORK
        validFrom: '2024-01-01'
        validTo: '2024-12-31'
        bestTimeToContact:
          day: MON
          startTime: '09:00'
          endTime: '17:00'
          allDay: false
    faxNumbers:
      type: object
      properties:
        number:
          $ref: '#/components/schemas/TEXT'
        type:
          $ref: '#/components/schemas/CODE-SET'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    emails:
      type: object
      properties:
        email:
          $ref: '#/components/schemas/TEXT'
        type:
          $ref: '#/components/schemas/CODE-SET'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    contactInformation:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/addresses'
        phoneList:
          type: array
          items:
            $ref: '#/components/schemas/phoneNumbers'
        faxList:
          type: array
          items:
            $ref: '#/components/schemas/faxNumbers'
        bestTimeToContact:
          $ref: '#/components/schemas/bestTimeToContact'
      example:
        address:
          line1: 123 Main St
          city: Springfield
          state: VA
          postalCode: '22150'
        phoneList:
          - number: '5551234567'
            type: WORK
            bestTimeToContact:
              day: MON
              startTime: '09:00'
              endTime: '17:00'
              allDay: false
        bestTimeToContact:
          day: MON
          startTime: '09:00'
          endTime: '17:00'
          allDay: false
    alternateIdentifiers:
      type: object
      properties:
        description:
          $ref: '#/components/schemas/TEXT'
        type:
          $ref: '#/components/schemas/CODE-SET'
        value:
          $ref: '#/components/schemas/TEXT'
        status:
          $ref: '#/components/schemas/BOOLEAN'
        issuer:
          $ref: '#/components/schemas/TEXT'
        issueDate:
          $ref: '#/components/schemas/DATE'
        startDate:
          $ref: '#/components/schemas/DATE'
        endDate:
          $ref: '#/components/schemas/DATE'
    externalUniqueIdentifier:
      type: object
      properties:
        issuer:
          $ref: '#/components/schemas/TEXT'
        value:
          $ref: '#/components/schemas/TEXT'
        status:
          $ref: '#/components/schemas/TEXT'
        startDate:
          $ref: '#/components/schemas/DATE'
        endDate:
          $ref: '#/components/schemas/DATE'
    authorizedOfficials:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/TEXT'
        prefix:
          $ref: '#/components/schemas/TEXT'
        first:
          $ref: '#/components/schemas/TEXT'
        middle:
          $ref: '#/components/schemas/TEXT'
        last:
          $ref: '#/components/schemas/TEXT'
        suffix:
          $ref: '#/components/schemas/TEXT'
        credential:
          $ref: '#/components/schemas/TEXT'
        phoneNumber:
          $ref: '#/components/schemas/TEXT'
    employerIdentificationNumber:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/TEXT'
        status:
          $ref: '#/components/schemas/BOOLEAN'
        issuer:
          $ref: '#/components/schemas/TEXT'
        issueDate:
          $ref: '#/components/schemas/DATE'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    naicsClassifications:
      type: object
      properties:
        sector:
          $ref: '#/components/schemas/CODE-SET'
        subSector:
          $ref: '#/components/schemas/CODE-SET'
        industryGroup:
          $ref: '#/components/schemas/CODE-SET'
        industry:
          $ref: '#/components/schemas/CODE-SET'
        nationalIndustry:
          $ref: '#/components/schemas/CODE-SET'
    sicClassifications:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/CODE-SET'
    qualifications:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CODE-SET'
        qualification:
          $ref: '#/components/schemas/TEXT'
        status:
          $ref: '#/components/schemas/CODE-SET'
        issuer:
          $ref: '#/components/schemas/TEXT'
        issueDate:
          $ref: '#/components/schemas/DATE'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    types:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TEXT'
        subType:
          $ref: '#/components/schemas/TEXT'
    contactOther:
      type: object
      properties:
        system:
          $ref: '#/components/schemas/CODE-SET'
        type:
          $ref: '#/components/schemas/CODE-SET'
        value:
          $ref: '#/components/schemas/TEXT'
        validFrom:
          $ref: '#/components/schemas/DATE'
        validTo:
          $ref: '#/components/schemas/DATE'
    product:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/TEXT'
        code:
          $ref: '#/components/schemas/TEXT'
        type:
          $ref: '#/components/schemas/CODE-SET'
        category:
          $ref: '#/components/schemas/TEXT'
        price:
          $ref: '#/components/schemas/NUMBER'
        status:
          $ref: '#/components/schemas/TEXT'
        description:
          $ref: '#/components/schemas/TEXT'
        launchDate:
          $ref: '#/components/schemas/DATE'
        market:
          $ref: '#/components/schemas/TEXT'
        lineOfBusiness:
          $ref: '#/components/schemas/TEXT'
        serviceLines:
          type: array
          items:
            type: object
            properties:
              serviceLine:
                $ref: '#/components/schemas/TEXT'
              subServiceLine:
                $ref: '#/components/schemas/TEXT'
    numberOfEmployees:
      type: object
      properties:
        numberOfEmployees:
          $ref: '#/components/schemas/NUMBER'
    foundedDate:
      type: object
      properties:
        foundedDate:
          $ref: '#/components/schemas/DATE'
    annualRevenue:
      type: object
      properties:
        annualRevenue:
          $ref: '#/components/schemas/NUMBER'
        year:
          $ref: '#/components/schemas/NUMBER'
    legalStatus:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/CODE-SET'
        source:
          $ref: '#/components/schemas/TEXT'
        effectiveDate:
          $ref: '#/components/schemas/DATE'
        verificationDate:
          $ref: '#/components/schemas/DATE'
        jurisdiction:
          $ref: '#/components/schemas/TEXT'
        registrationCountry:
          $ref: '#/components/schemas/CODE-SET'
    IdentityPerSource:
      type: object
      description: >-
        Identity view with attributes grouped by the single source that provided
        them.
      properties:
        source:
          $ref: '#/components/schemas/Source'
    PostIdentityWsRequest:
      type: object
      description: Adds a new identity to Verato.
      required:
        - identity
      properties:
        identity:
          $ref: '#/components/schemas/Identity'
        responseIdentityFormatNames:
          type: array
          description: >-
            Names of response identity formats to include. If omitted, DEFAULT
            is assumed.
          items:
            type: string
    PostIdentityWsResponse:
      type: object
      description: PostIdentity service response.
      properties:
        identityGroupedBySource:
          type: array
          description: Alternative view where info is grouped by source.
          items:
            $ref: '#/components/schemas/IdentityPerSource'
        customerSources:
          type: array
          items:
            type: string
        linkIdentity:
          description: The link identity as it exists in Verato.
          $ref: '#/components/schemas/Identity'
        linkId:
          type: string
          description: link ID of the returned identity, if any; null if no match.
        identity:
          description: Found identity, if any; null if no match.
          $ref: '#/components/schemas/Identity'
        domains:
          type: array
          description: Domains of the returned identity, if any.
          items:
            $ref: '#/components/schemas/Domain'
        customizedIdentities:
          description: Alternative views customized by view name, keyed by view name.
          type: object
          additionalProperties:
