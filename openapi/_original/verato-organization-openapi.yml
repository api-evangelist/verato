        and surviving source information.
      properties:
        linkId:
          type: string
          description: link ID of the surviving identity.
        toSurviveSource:
          description: Original source information for the surviving identity.
          $ref: '#/components/schemas/Source'
    UnmergeIdentitiesWsRequest:
      type: object
      description: |
        Request to unmerge data from the retired section of an identity into a
        new identity.
      required:
        - unmergeFromSource
        - unmergeSource
      properties:
        unmergeFromSource:
          description: Source info targeting the identity from which to unmerge.
          $ref: '#/components/schemas/Source'
        unmergeSource:
          description: Source representing the identity being unmerged.
          $ref: '#/components/schemas/Source'
    UnmergeIdentitiesWsResponse:
      type: object
      description: |
        Response to unmerge identities request, providing link IDs and source
        information for the unmerged identities.
      required:
        - unmergedId
        - unmergedFromId
        - unmergedSource
        - unmergedFromSource
      properties:
        unmergedSource:
          description: Source information of the identity that was unmerged.
          $ref: '#/components/schemas/Source'
        unmergedFromSource:
          description: Source information for the identity unmerged from.
          $ref: '#/components/schemas/Source'
        unmergedId:
          type: string
          description: link ID of the identity that was unmerged.
        unmergedFromId:
          type: string
          description: link ID of the identity unmerged from.
