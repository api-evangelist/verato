openapi: 3.0.3
info:
  title: Verato Organization AddRelationshipService ReactivateSourceWs API
  version: 2026.1.2
  description: 'The Verato Organization API provides comprehensive identity management capabilities for organizations within the Verato LINK platform. This API enables you to:


    - **Ingest and manage organization identities**: Add, update, and delete organization records with rich demographic and contact information.

    - **Search and query**: Find organizations using demographic data, native IDs, or link IDs (Verato''s golden identifier).

    - **Lifecycle management**: Soft-delete and restore organization records while preserving data history.

    - **Merge and link operations**: Consolidate duplicate organizations, manage master data relationships, and maintain data lineage.

    - **Relationship management**: Define and query relationships between organizations (parent-child, affiliations, etc.).

    - **Notifications**: Track and audit identity changes and events across your organization data.


    All operations follow a standard request/response envelope pattern with audit tracking, error handling, and optional response format customization.

    '
servers:
- url: https://yourveratodomain.com/org-link-ws/svc
  description: Production Organization Link API
- url: https://yourveratodomain.com/org-link-ws/svc
  description: Sandbox Organization Link API
security:
- basicAuth: []
tags:
- name: ReactivateSourceWs
paths:
  /reactivateSourceWs:
    post:
      summary: Reactivate source from identities (reactivateSourceWs)
      description: Used to reactivate a source record from your instance of Universal Identity, that was previously deactivated.
      operationId: post_reactivateSourceWs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_reactivateSourceWs'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_reactivateSourceWs'
      tags:
      - ReactivateSourceWs
components:
  schemas:
    ReactivateSourceWsResponse:
      type: object
      properties:
        linkIdsModified:
          type: array
          items:
            type: string
          description: Entity Ids which got modified
        linkIdCreated:
          type: string
          description: Entity Id which got created
      required:
      - linkIdsModified
      description: Service response for a ReactivateSourceWsResponse
    Source:
      type: object
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-mm-dd).
        name:
          type: string
          description: The name of the data source.  Must be unique across Verato.
        id:
          type: string
          description: The ID of an identity within the given data source.
      description: Represents the information tracking an identity to a source that contains the identity
    ServiceResponse_reactivateSourceWs:
      type: object
      properties:
        auditId:
          type: string
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        retryableError:
          type: boolean
        message:
          type: string
        content:
          $ref: '#/components/schemas/ReactivateSourceWsResponse'
        errors:
          type: array
          items:
            type: string
        trackingId:
          type: string
    ReactivateSourceWsRequest:
      type: object
      required:
      - sourceToReactivate
      properties:
        sourceToReactivate:
          $ref: '#/components/schemas/Source'
          description: The source to reactivate.
    ServiceRequest_reactivateSourceWs:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/ReactivateSourceWsRequest'
        trackingId:
          type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
