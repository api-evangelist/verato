openapi: 3.2.0
info:
  title: Verato Link Identities API
  version: 2026.1.2
  description: 'Operations tagged LinkIdentities across 2 of this provider''s published API definitions: verato-organization-openapi.yml, verato-person-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://yourveratodomain.com/org-link-ws/svc
  description: Production Organization Link API
- url: https://yourveratodomain.com/link-ws/svc
  description: Production Link API
security:
- basicAuth: []
tags:
- name: LinkIdentities
paths:
  /linkIdentities:
    post:
      summary: Link two identities (linkIdentities)
      description: Links two existing identities together without retiring either source. This is typically used when you determine that two separate source identities belong to the same real-world person, and they should be represented as a single link ID.
      operationId: linkIdentities
      requestBody:
        required: true
        description: The link identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_linkIdentities'
      responses:
        '200':
          description: Successful link identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_linkIdentities'
      tags:
      - LinkIdentities
    servers:
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Production Organization Link API
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Sandbox Organization Link API
components:
  schemas:
    Source:
      type: object
      description: Tracks an identity to a particular source system and record ID.
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-MM-dd).
        name:
          type: string
          description: Name of the data source. Must be unique across Verato.
        id:
          type: string
          description: ID of an identity within the given data source.
    ServiceResponse_linkIdentities:
      type: object
      properties:
        auditId:
          type: string
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        retryableError:
          type: boolean
        message:
          type: string
        content:
          $ref: '#/components/schemas/LinkIdentitiesWsResponse'
        errors:
          type: array
          items:
            type: string
        trackingId:
          type: string
    LinkIdentitiesWsRequest:
      type: object
      description: 'Represents a request to link data from one identity into another, usually

        across sources.

        '
      required:
      - source
      - linkToSource
      properties:
        linkToSource:
          description: Target identity (source name + native ID) to link to.
          $ref: '#/components/schemas/Source'
        source:
          description: Identity (source name + native ID) that will be linked.
          $ref: '#/components/schemas/Source'
    ServiceRequest_linkIdentities:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/LinkIdentitiesWsRequest'
        trackingId:
          type: string
    LinkIdentitiesWsResponse:
      type: object
      description: 'Response to link identities request, returning the primary link ID and

        linkToSource information.

        '
      properties:
        linkId:
          type: string
          description: link ID of the identity that received data in a link request.
        linkToSource:
          description: Original source information for the link-to identity.
          $ref: '#/components/schemas/Source'
    Source_2:
      type: object
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-mm-dd).
        name:
          type: string
          description: The name of the data source.  Must be unique across Verato.
        id:
          type: string
          description: The ID of an identity within the given data source.
      description: Represents the information tracking an identity to a source that contains the identity
    LinkIdentitiesWsRequest_2:
      type: object
      properties:
        linkToSource:
          $ref: '#/components/schemas/Source_2'
          description: The source name + native ID of the target Identity that will be linked to the Identity identified by the source.
        source:
          $ref: '#/components/schemas/Source_2'
          description: The source name + native ID of the Identity that will be linked to the Identity identified by the link-to source.
      required:
      - source
      - linkToSource
      description: Represents a request by a customer to link data from one Identity into another. Generally, this means linking two source name + native ID combinations from different sources.
    LinkIdentitiesWsResponse_2:
      type: object
      properties:
        linkId:
          type: string
          description: The link ID of the Identity that received data in a LinkIdentity request
        linkToSource:
          $ref: '#/components/schemas/Source_2'
          description: The original source information for the Identity that was the linkTo Identity. If the link fails, this will be null.
      description: When two identities have been linked by the LinkIdentities WebService, return the link ID of the primary Identity
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- verato-organization-openapi.yml
- verato-person-openapi.yml
