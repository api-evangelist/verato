openapi: 3.2.0
info:
  title: Verato Unmerge Identities API
  version: 2026.1.2
  description: 'Operations tagged UnmergeIdentities across 2 of this provider''s published API definitions: verato-organization-openapi.yml, verato-person-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://yourveratodomain.com/org-link-ws/svc
  description: Production Organization Link API
- url: https://yourveratodomain.com/link-ws/svc
  description: Production Link API
security:
- basicAuth: []
tags:
- name: UnmergeIdentities
paths:
  /unmergeIdentities:
    post:
      summary: Unmerge two identities (unmergeIdentities)
      description: Reverses a previous merge operation by extracting a previously merged source identity into its own record. Returns the new link ID and the linkId it was unmerged from.
      operationId: unmergeIdentities
      requestBody:
        required: true
        description: The unmerge identities request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_unmergeIdentities'
      responses:
        '200':
          description: Successful unmerge identities operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_unmergeIdentities'
      tags:
      - UnmergeIdentities
    servers:
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Production Organization Link API
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Sandbox Organization Link API
components:
  schemas:
    ServiceResponse_unmergeIdentities:
      type: object
      properties:
        auditId:
          type: string
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        retryableError:
          type: boolean
        message:
          type: string
        content:
          $ref: '#/components/schemas/UnmergeIdentitiesWsResponse'
        errors:
          type: array
          items:
            type: string
        trackingId:
          type: string
    ServiceRequest_unmergeIdentities:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/UnmergeIdentitiesWsRequest'
        trackingId:
          type: string
    Source:
      type: object
      description: Tracks an identity to a particular source system and record ID.
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-MM-dd).
        name:
          type: string
          description: Name of the data source. Must be unique across Verato.
        id:
          type: string
          description: ID of an identity within the given data source.
    UnmergeIdentitiesWsRequest:
      type: object
      description: 'Request to unmerge data from the retired section of an identity into a

        new identity.

        '
      required:
      - unmergeFromSource
      - unmergeSource
      properties:
        unmergeFromSource:
          description: Source info targeting the identity from which to unmerge.
          $ref: '#/components/schemas/Source'
        unmergeSource:
          description: Source representing the identity being unmerged.
          $ref: '#/components/schemas/Source'
    UnmergeIdentitiesWsResponse:
      type: object
      description: 'Response to unmerge identities request, providing link IDs and source

        information for the unmerged identities.

        '
      required:
      - unmergedId
      - unmergedFromId
      - unmergedSource
      - unmergedFromSource
      properties:
        unmergedSource:
          description: Source information of the identity that was unmerged.
          $ref: '#/components/schemas/Source'
        unmergedFromSource:
          description: Source information for the identity unmerged from.
          $ref: '#/components/schemas/Source'
        unmergedId:
          type: string
          description: link ID of the identity that was unmerged.
        unmergedFromId:
          type: string
          description: link ID of the identity unmerged from.
    Source_2:
      type: object
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-mm-dd).
        name:
          type: string
          description: The name of the data source.  Must be unique across Verato.
        id:
          type: string
          description: The ID of an identity within the given data source.
      description: Represents the information tracking an identity to a source that contains the identity
    UnmergeIdentitiesWsRequest_2:
      type: object
      required:
      - unmergeFromSource
      - unmergeSource
      properties:
        unmergeFromSource:
          $ref: '#/components/schemas/Source_2'
          description: Return the source info that targets the Identity from which we will unmerge the source Identity
        unmergeSource:
          $ref: '#/components/schemas/Source_2'
          description: Represents the source that will be unmerged
      description: a request by a customer to unmerge ( extract) data from retired section of one Identity to create another new Identity
    UnmergeIdentitiesWsResponse_2:
      type: object
      properties:
        unmergedSource:
          $ref: '#/components/schemas/Source_2'
          description: The source information of identity that was unmerged
        unmergedFromSource:
          $ref: '#/components/schemas/Source_2'
          description: The source information for unmerged from Identity
        unmergedId:
          type: string
          description: Link ID of the Identity that was unmerged
        unmergedFromId:
          type: string
          description: Link ID of Identity unmerged from.
      required:
      - unmergedId
      - unmergedFromId
      - unmergedSource
      - unmergedFromSource
      description: "When two identities have been merged by the MergeIdentities WebService , unmerge them by \n extracting the previously merged Identity into its own record."
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- verato-organization-openapi.yml
- verato-person-openapi.yml
