openapi: 3.2.0
info:
  title: Verato Delete Source Identity API
  version: 2026.1.2
  description: 'Operations tagged DeleteSourceIdentity across 2 of this provider''s published API definitions: verato-organization-openapi.yml, verato-person-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://yourveratodomain.com/org-link-ws/svc
  description: Production Organization Link API
- url: https://yourveratodomain.com/link-ws/svc
  description: Production Link API
security:
- basicAuth: []
tags:
- name: DeleteSourceIdentity
paths:
  /deleteSourceIdentity:
    post:
      summary: Hard Delete a Source (deleteSourceIdentity)
      description: 'Permanently removes all information and history associated with the given

        source (source name + nativeId) from Verato. This also removes any

        merge/unmerge history associated with that source.'
      operationId: deleteSourceIdentity
      requestBody:
        required: true
        description: The web service request containing the source to delete.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceRequest_deleteSourceIdentity'
      responses:
        '200':
          description: Successful delete source identity operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse_deleteSourceIdentity'
      tags:
      - DeleteSourceIdentity
    servers:
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Production Organization Link API
    - url: https://yourveratodomain.com/org-link-ws/svc
      description: Sandbox Organization Link API
components:
  schemas:
    Source:
      type: object
      description: Tracks an identity to a particular source system and record ID.
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-MM-dd).
        name:
          type: string
          description: Name of the data source. Must be unique across Verato.
        id:
          type: string
          description: ID of an identity within the given data source.
    DeleteSourceIdentityWsResponse:
      type: object
      description: 'Service response for a source-based delete. Indicates which linkIds were

        modified and which were deleted.

        '
      properties:
        linkIdsModified:
          type: array
          description: link IDs with information removed but not deleted.
          items:
            type: string
        linkIdsDeleted:
          type: array
          description: link IDs that were deleted.
          items:
            type: string
    DeleteSourceIdentityWsRequest:
      type: object
      description: Deletes all information associated with the provided source.
      required:
      - source
      properties:
        source:
          description: The source to remove from the database.
          $ref: '#/components/schemas/Source'
    ServiceResponse_deleteSourceIdentity:
      type: object
      properties:
        auditId:
          type: string
        success:
          type: boolean
        warnings:
          type: array
          items:
            type: string
        retryableError:
          type: boolean
        message:
          type: string
        content:
          $ref: '#/components/schemas/DeleteSourceIdentityWsResponse'
        errors:
          type: array
          items:
            type: string
        trackingId:
          type: string
    ServiceRequest_deleteSourceIdentity:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/DeleteSourceIdentityWsRequest'
        trackingId:
          type: string
    Source_2:
      type: object
      properties:
        date:
          type: string
          description: The date of the source data in ISO format (yyyy-mm-dd).
        name:
          type: string
          description: The name of the data source.  Must be unique across Verato.
        id:
          type: string
          description: The ID of an identity within the given data source.
      description: Represents the information tracking an identity to a source that contains the identity
    DeleteSourceIdentityWsResponse_2:
      type: object
      properties:
        linkIdsModified:
          type: array
          items:
            type: string
          description: The list of LINK ids that had information removed, but were not deleted
        linkIdsDeleted:
          type: array
          items:
            type: string
          description: The list of LINK ids that were deleted
      description: Service response for a Source-based query
    DeleteSourceIdentityWsRequest_2:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/Source_2'
          description: The source to remove from the database
      required:
      - source
      description: Deletes all information associated with the source provided within
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
x-refined-from:
- verato-organization-openapi.yml
- verato-person-openapi.yml
